services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5

  tool_a:
    build: ./mock_tools
    command: uvicorn tool_a:app --host 0.0.0.0 --port 8000

  tool_b:
    build: ./mock_tools
    command: uvicorn tool_b:app --host 0.0.0.0 --port 8000

  tool_c:
    build: ./mock_tools
    command: uvicorn tool_c:app --host 0.0.0.0 --port 8000

  gateway:
    build: ./gateway
    ports:
      - "8000:8000"
    volumes:
      - ./frontend:/frontend:ro
    env_file:
      - .env
    environment:
      REDIS_URL: ${REDIS_URL}
      DATABASE_URL: ${DATABASE_URL}
      TOOL_A_URL: ${TOOL_A_URL}
      TOOL_B_URL: ${TOOL_B_URL}
      TOOL_C_URL: ${TOOL_C_URL}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  worker:
    build: ./worker
    env_file:
      - .env
    environment:
      REDIS_URL: ${REDIS_URL}
      DATABASE_URL: ${DATABASE_URL}
      TOOL_A_URL: ${TOOL_A_URL}
      TOOL_B_URL: ${TOOL_B_URL}
      TOOL_C_URL: ${TOOL_C_URL}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      tool_a:
        condition: service_started
      tool_b:
        condition: service_started
      tool_c:
        condition: service_started

volumes:
  pgdata:
